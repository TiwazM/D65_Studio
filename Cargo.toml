[package]
name = "d65-studio"
version = "0.3.1"
edition = "2021"
license = "MIT"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15"
tiny_http = "0.12"
httpdate = "1"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
fs2 = "0.4"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Services", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Console", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_WNet", "Win32_Security"] }

[profile.release]
opt-level = 2
strip = true
