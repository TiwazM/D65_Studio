# Builds MEGA65 DiskLab for macOS, Windows and Linux when a release tag is
# pushed (git tag v0.3.2 && git push origin v0.3.2) and attaches the packages
# to a GitHub Release for that tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (universal .app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build both architectures
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
      - name: Bundle
        run: |
          set -eu
          app='MEGA65 DiskLab.app'
          rm -rf "out/$app" && mkdir -p "out/$app/Contents/MacOS" "out/$app/Contents/Resources"
          lipo -create target/aarch64-apple-darwin/release/mega65-disklab target/x86_64-apple-darwin/release/mega65-disklab -output "out/$app/Contents/MacOS/mega65-disklab"
          cp README.md LICENSE WINDOWS.txt launcher/Reader-notes.txt launcher/Resident-driver.txt launcher/Resident-demo.bas launcher/LOAD-compatibility.txt "out/$app/Contents/Resources/"
          cp packaging/Info.plist "out/$app/Contents/Info.plist"
          codesign --force --deep --sign - "out/$app"
          cd out && ditto -c -k --keepParent "$app" "MEGA65-DiskLab-${GITHUB_REF_NAME}-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*.zip

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --locked --release
      - name: Package
        shell: pwsh
        run: |
          $name = "MEGA65-DiskLab-$env:GITHUB_REF_NAME-windows-x64"
          New-Item -ItemType Directory -Path "out/$name/launcher" -Force | Out-Null
          Copy-Item target/release/mega65-disklab.exe "out/$name/"
          Copy-Item README.md, WINDOWS.txt, LICENSE "out/$name/"
          Copy-Item launcher/Reader-notes.txt, launcher/Resident-driver.txt, launcher/Resident-demo.bas, launcher/LOAD-compatibility.txt "out/$name/launcher/"
          Compress-Archive -Path "out/$name" -DestinationPath "out/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.zip

  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for eframe
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libssl-dev pkg-config
      - name: Build
        run: cargo build --locked --release
      - name: Package
        run: |
          set -eu
          name="MEGA65-DiskLab-${GITHUB_REF_NAME}-linux-x64"
          mkdir -p "out/$name/launcher"
          cp target/release/mega65-disklab README.md LICENSE "out/$name/"
          cp launcher/Reader-notes.txt launcher/Resident-driver.txt launcher/Resident-demo.bas launcher/LOAD-compatibility.txt "out/$name/launcher/"
          tar -C out -czf "out/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*.tar.gz

  release:
    name: GitHub Release
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
          body: |
            MEGA65 DiskLab ${{ github.ref_name }}.

            - macOS: universal app bundle (Apple silicon and Intel), ad-hoc signed; allow it once under Privacy & Security on first launch.
            - Windows: x64 executable. Direct SD-card export uses the Windows helper; see WINDOWS.txt.
            - Linux: x64 executable. Disk editing, compilations and Send to MEGA65 work; the Finder/Explorer mount and the direct SD-card export are macOS/Windows only.
